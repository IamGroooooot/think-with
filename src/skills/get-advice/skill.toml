invocation = "auto"
files = [
  "references/discovery.md",
  "references/expert-briefing.md",
  "references/fact-check.md",
  "references/execution.md",
]

[origin]
repository = "https://github.com/IamGroooooot/skills"
revision = "edcb31d52f7a6b1cfff5860073659ccd3d7a089b"
path = "get-advice"

[claude]
agents = [
  "assets/agents/get-advice-expert.md",
  "assets/agents/get-advice-checker.md",
]

[claude.blocks]
questions = "Use `AskUserQuestion` when available, following its current schema; otherwise ask briefly in chat."
experts = "Use fresh `Agent` calls with the bundled `get-advice-expert` type: Claude Fable 5.1, low effort. Pass each expert only its self-contained brief."
checkers = "Use fresh `Agent` calls with the bundled `get-advice-checker` type: Claude Opus 5, medium effort. Pass each checker only its assigned evidence bundle."
execution = '''
The plugin registers `think-with:get-advice-expert` (model
`claude-fable-5-1`, effort `low`) and `think-with:get-advice-checker`
(model `claude-opus-5`, effort `medium`). Use the registered type in
`Agent.subagent_type`, with a short `description` and a self-contained `prompt`.
The definitions set model and effort; do not override them with a floating model
alias or pass Codex's `reasoning_effort` or `fork_turns` fields to `Agent`.
Never use the `fork` type for experts or checkers: it inherits the conversation.

For a standalone skill installation, the same definitions are bundled as
[expert](../assets/agents/get-advice-expert.md) and
[checker](../assets/agents/get-advice-checker.md). If their types are absent,
register those files in the current project's `.claude/agents/`, subject to
the host's write permissions. Preserve any existing definitions; do not
overwrite conflicts. Use the unprefixed type names once loaded. If a newly
created agents directory is not detected, tell the user to restart the session.
Do not modify global configuration. Use the fallback below if registration is
unavailable or conflicts cannot be resolved within the user's request.

Use only the brief and assigned sources as task evidence. Non-fork agents may
still receive host project instructions; do not count that as independent
research or read unrelated local material. If this consultation was delegated
to a coordinator without permission to spawn agents, return the prepared
briefs and draft to the parent to run the consultation and final check, then
resume synthesis from the actual results. Report any unfinished stage.
'''

[codex.blocks]
questions = "Use `request_user_input` when available in the current mode, following its current schema; otherwise ask briefly in chat."
experts = "Use native `spawn_agent` calls with `model = \"gpt-6-astra\"`, `reasoning_effort = \"low\"`, and `fork_turns = \"none\"`. Pass each expert only its self-contained brief."
checkers = "Use native `spawn_agent` calls with `model = \"gpt-5.6-luna\"`, `reasoning_effort = \"xhigh\"`, and `fork_turns = \"none\"`. Pass each checker only its assigned evidence bundle."
execution = '''
Use the session's native `spawn_agent` tool with a unique task name and the
prepared brief as its message. Set `fork_turns = "none"` for every expert and
checker. Default experts to `gpt-6-astra` with `reasoning_effort = "low"`;
default checkers to `gpt-5.6-luna` with `reasoning_effort = "xhigh"`.
Use the available native messaging and completion tools to collect actual
results; launching an agent does not establish that its work is complete.
Follow the tool schema exposed in the current session rather than inventing
an alternative CLI or environment variable. Keep bundled resource paths
relative to the loaded SKILL.md location, not the caller's working directory.
'''

[codex.openai.interface]
display_name = "Get Advice"
short_description = "Research fields, expert advice, and verified evidence"
default_prompt = "Use $get-advice to find evidence-rich research fields useful to my problem and consult grounded expert perspectives."
