# Input to blind_round.py build (internal skill blind-grade), run from the repository root.
package = "plugins/claude/think-with"
seed = 20260929
intro = "케이스마다 두 답변을 A와 B로 무작위로 배치했습니다. 두 답변 모두 플러그인을 설치한 상태의 답변이고, 하나는 lay-out 수정안 r2, 다른 하나는 0.1.4입니다. 답변 본문은 수정하지 않았습니다."

# label = result folder under <suite>/results/, with ":without" for the no-plugin arm of a with-without run.
[arms]
r2 = "r2"
"0.1.4" = "0.1.4"

# run is the 0-based run index. h3 uses run 2 because 0.1.4's h3 run 1 was graded in evals-holdout-r1-vs-0.1.4.
[[pairs]]
case = "f1-diff-retry-policy"
suite = "evals-holdout2"
run = 1
summary = "머지 전 PR: 외부 API 호출을 공통 재시도 정책으로 모음 (Python)"

